<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все сигналы</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --col-width-select: 4%;
            --col-width-id: 5%;
            --col-width-status: 8%;
            --col-width-tags: 6%;
            --col-width-code: 12%;
            --col-width-type: 10%;
            --col-width-description: 25%;
            --col-width-author: 15%;
            --col-width-actions: 15%;

            --primary-color: #e94560;
            --secondary-color: #4a90d9;
            --delete-color: #f87171;
            --assign-color: #4ade80;
            --warn-color: #fbbf24;
            --hover-color: #e94560;
            --border-color: #0f3460;
            --text-color: #eee;
            --background-color: #1a1a2e;
            --card-color: #16213e;
            --header-bg-color: #0f3460;
            --alt-row-color: rgba(255,255,255,0.02);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--background-color);
            color: var(--text-color);
        }

        .container {
            width: 96%;
            margin: 20px auto;
            padding: 20px;
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .header {
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h1 { color: var(--primary-color); font-size: 24px; font-weight: 600; }

        .tags-legend {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            min-height: 46px;
        }

        .legend-label { font-size: 13px; color: #889; margin-right: 5px; }

        .tag-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: #232342;
            border: 1px solid #333;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            user-select: none;
        }

        .tag-chip:hover { background: #2a2a4e; border-color: #555; }
        .tag-chip.active { background: rgba(233, 69, 96, 0.2); border-color: var(--primary-color); }

        .tag-color-box {
            width: 12px; height: 12px;
            border-radius: 2px;
        }

        .add-tag-btn {
            background: none; border: 1px dashed #555; color: #777;
            width: 24px; height: 24px; border-radius: 4px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }
        .add-tag-btn:hover { border-color: var(--assign-color); color: var(--assign-color); }

        .user-info {
            background: rgba(10,10,26,0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 13px;
            color: #ccc;
            display: flex; gap: 8px; align-items: center;
        }

        .controls {
            margin-bottom: 20px;
            display: flex; gap: 12px; flex-wrap: wrap;
        }

        #search-input {
            flex: 1; min-width: 260px; padding: 12px 15px;
            border: 1px solid #233860; border-radius: 6px;
            background: #0a0a1a; color: var(--text-color); font-size: 15px;
        }

        .button {
            background: #0f3460; color: var(--text-color);
            border: 1px solid #233860; padding: 10px 18px;
            border-radius: 6px; cursor: pointer;
            display: inline-flex; align-items: center; gap: 8px;
            font-weight: 500; transition: all 0.25s;
        }
        .button.primary { background: var(--secondary-color); }
        .button.primary:hover { background: var(--hover-color); }
        .button.primary.active { background: #e94560; box-shadow: inset 0 2px 6px rgba(0,0,0,0.3); }
        .button.delete { background: var(--delete-color); color: #0a0a0a; }
        .button.assign { background: var(--assign-color); color: #0a0a0a; }
        .button.warn { background: var(--warn-color); color: #0a0a0a; }
        .button:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,0,0,0.25); }
        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #projects-table {
            width: 100%; border-collapse: collapse; background: #0a0a1a;
            border: 1px solid var(--border-color); border-radius: 10px;
            overflow: hidden; table-layout: fixed; min-width: 1180px;
        }

        th, td {
            padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.08);
            color: var(--text-color); text-align: left;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        th:nth-child(1), td:nth-child(1) { width: var(--col-width-select); }
        th:nth-child(2), td:nth-child(2) { width: var(--col-width-id); }
        th:nth-child(3), td:nth-child(3) { width: var(--col-width-status); }
        th:nth-child(4), td:nth-child(4) { width: var(--col-width-tags); }
        th:nth-child(5), td:nth-child(5) { width: var(--col-width-code); }
        th:nth-child(6), td:nth-child(6) { width: var(--col-width-type); }
        th:nth-child(7), td:nth-child(7) { width: var(--col-width-description); }
        th:nth-child(8), td:nth-child(8) { width: var(--col-width-author); }
        th:nth-child(9), td:nth-child(9) { width: var(--col-width-actions); }

        th {
            background: var(--header-bg-color); font-weight: 600;
            position: sticky; top: 0; z-index: 5; cursor: pointer; user-select: none;
        }
        th.sortable::after { content: "↕"; margin-left: 8px; font-size: 0.8em; opacity: 0.7; }
        th.sortable.asc::after { content: "↑"; opacity: 1; }
        th.sortable.desc::after { content: "↓"; opacity: 1; }

        .select-header, .select-cell {
            text-align: center;
        }
        .select-header {
            cursor: default !important;
        }

        #select-all-projects,
        .project-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--secondary-color);
        }

        tr:nth-child(even) { background: var(--alt-row-color); }
        tr:hover { background: rgba(233,69,96,0.08); }
        .row-selected { background: rgba(74,144,217,0.14) !important; }

        .tags-cell { display: flex; gap: 4px; flex-wrap: wrap; }
        .mini-tag-box {
            width: 14px; height: 14px; border-radius: 2px;
            cursor: help; flex-shrink: 0;
        }

        .actions-cell { padding: 8px 10px; overflow: visible; white-space: normal; }
        .action-stack { display: flex; gap: 8px; flex-wrap: wrap; }
        .status-pill { display: flex; align-items: center; gap: 6px; font-size: 12px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

        .author-select {
            padding: 8px 12px; border: 1px solid #233860;
            border-radius: 6px; background: #0a0a1a; color: var(--text-color);
        }

        .empty-state { text-align: center; padding: 40px; color: #99a; font-style: italic; font-size: 16px; }

        .context-menu {
            position: fixed; z-index: 2000; background: #16213e;
            border: 1px solid #0f3460; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); display: none; min-width: 180px;
        }
        .context-menu ul { list-style: none; padding: 6px 0; }
        .context-menu ul li {
            padding: 10px 16px; display: flex; gap: 10px; align-items: center;
            cursor: pointer; color: var(--text-color); transition: background 0.2s;
        }
        .context-menu ul li:hover { background: rgba(233,69,96,0.2); color: var(--primary-color); }

        .tag-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 3000;
            display: none; align-items: center; justify-content: center;
        }
        .tag-modal {
            background: #16213e; padding: 20px; border-radius: 10px;
            border: 1px solid #0f3460; min-width: 300px;
        }
        .tag-modal h3 { margin-bottom: 15px; color: var(--secondary-color); }
        .tag-list { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .tag-option { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 5px; border-radius: 4px; }
        .tag-option:hover { background: rgba(255,255,255,0.05); }
        .tag-option input { transform: scale(1.2); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-top">
                <h1>📋 Все сигналы</h1>
                <div class="user-info">
                    <strong>Пользователь:</strong>
                    <span id="current-user">—</span>
                    <span id="user-role"></span>
                </div>
            </div>

            <div class="tags-legend" id="tags-legend">
                <span class="legend-label">Фильтр по тегам:</span>
                <button id="btn-add-tag" class="add-tag-btn" style="display:none;" title="Создать новый тег">+</button>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="search-input" placeholder="Поиск по коду...">
            <button id="my-projects" class="button primary">🔖 Мои проекты</button>
            <button id="refresh-projects" class="button primary">🔄 Обновить</button>
            <button id="delete-selected" class="button delete" disabled>🗑️ Удалить выбранные</button>
            <button id="export-selected" class="button primary" disabled>📦 Экспортировать</button>
        </div>

        <table id="projects-table">
            <thead>
                <tr>
                    <th class="select-header">
                        <input type="checkbox" id="select-all-projects" title="Выделить все">
                    </th>
                    <th>№</th>
                    <th class="sortable" id="sort-status">Статус</th>
                    <th class="sortable" id="sort-tags">Теги</th>
                    <th>Код</th>
                    <th class="sortable" id="sort-type">Тип</th>
                    <th>Описание</th>
                    <th class="sortable" id="sort-author">Автор</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="projects-body">
                <tr><td colspan="9" class="empty-state">Загрузка проектов...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="context-menu" class="context-menu">
        <ul>
            <li id="ctx-open-project">📂 Открыть проект</li>
            <li id="ctx-copy-code">📋 Копировать код</li>
            <li id="ctx-manage-tags">🏷️ Управление тегами</li>
            <li id="ctx-show-history">🕓 История статусов</li>
        </ul>
    </div>

    <div id="tag-modal-overlay" class="tag-modal-overlay">
        <div class="tag-modal">
            <h3>Назначить теги</h3>
            <div id="tag-list-container" class="tag-list"></div>
            <div class="modal-actions">
                <button class="button" onclick="closeTagModal()">Отмена</button>
                <button class="button primary" onclick="saveTagsForProject()">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const currentUser = urlParams.get('user') || 'Аноним';
        document.getElementById('current-user').textContent = currentUser;

        let allProjects = [];
        let filteredProjects = [];
        let tagsData = { tags: [], assignments: {} };
        let availableAuthors = [];
        let adminAuthor = '';
        let showMyProjects = false;
        let sortBy = 'type';
        let sortOrder = 'asc';
        let activeTagFilter = null;
        let selectedProject = null;
        let selectedProjects = new Set();

        const STATUS_CONFIG = {
            draft:    { color: '#f87171', label: 'Черновик', sort: 0 },
            ready:    { color: '#34d399', label: 'Готов',    sort: 2 },
            reverted: { color: '#fbbf24', label: 'Возврат',  sort: 1 }
        };

        function isCurrentUserAdmin() { return currentUser === adminAuthor; }
        function isAdminOrOwner(project) { return isCurrentUserAdmin() || project.author === currentUser; }

        function getProjectDescription(project) {
            if (project.type === 'rule') return project.possibleCause || '—';
            return project.description || '—';
        }

        async function loadTags() {
            try {
                const resp = await fetch('/api/tags/list');
                tagsData = await resp.json();
                renderLegend();
            } catch (e) {
                console.error("Ошибка загрузки тегов", e);
            }
        }

        function renderLegend() {
            const container = document.getElementById('tags-legend');
            const addBtn = document.getElementById('btn-add-tag');
            container.innerHTML = `<span class="legend-label">Фильтр по тегам:</span>`;

            tagsData.tags.forEach(tag => {
                const el = document.createElement('div');
                el.className = `tag-chip ${activeTagFilter === tag.id ? 'active' : ''}`;
                el.innerHTML = `<div class="tag-color-box" style="background:${tag.color}"></div><span>${tag.name}</span>`;
                el.onclick = () => {
                    activeTagFilter = activeTagFilter === tag.id ? null : tag.id;
                    renderLegend();
                    filterProjects();
                };
                container.appendChild(el);
            });

            container.appendChild(addBtn);
            if (isCurrentUserAdmin()) {
                addBtn.style.display = 'flex';
                addBtn.onclick = createNewTag;
            }
        }

        async function createNewTag() {
            const name = prompt("Название нового тега:");
            if (!name || !name.trim()) return;

            const color = getRandomColor();

            try {
                const resp = await fetch('/api/tags/create', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user: currentUser, name: name.trim(), color: color })
                });

                if (!resp.ok) {
                    const err = await resp.json();
                    throw new Error(err.detail || "Ошибка сервера");
                }

                await loadTags();
            } catch (e) {
                alert(e.message);
            }
        }

        function getProjectTags(filename) {
            const ids = tagsData.assignments[filename] || [];
            return ids.map(id => tagsData.tags.find(t => t.id === id)).filter(Boolean);
        }

        const NEON_PALETTE = [
            '#ff0055', '#00ff99', '#00ccff', '#ffcc00', '#9900ff', '#ff6600',
            '#ff3399', '#00ffcc', '#ccff00', '#ff99cc', '#99ccff', '#ff5e78',
            '#f4d35e', '#0affc2'
        ];

        function getRandomColor() {
            const randomIndex = Math.floor(Math.random() * NEON_PALETTE.length);
            return NEON_PALETTE[randomIndex];
        }

        async function loadProjects() {
            const body = document.getElementById('projects-body');
            body.innerHTML = `<tr><td colspan="9" class="empty-state">Загрузка...</td></tr>`;
            try {
                const resp = await fetch('/api/project/list');
                if (!resp.ok) throw new Error('Не удалось получить список');
                const data = await resp.json();

                adminAuthor = data.adminAuthor || '';
                availableAuthors = data.authors || [];
                allProjects = data.projects.filter(p => p.source === 'projects');

                const existing = new Set(allProjects.map(p => p.filename));
                selectedProjects = new Set([...selectedProjects].filter(fn => existing.has(fn)));

                const role = document.getElementById('user-role');
                role.textContent = '';
                if (isCurrentUserAdmin()) {
                    role.textContent = '(Админ)';
                    role.style.color = '#e94560';
                }

                await loadTags();
                filterProjects();
            } catch (err) {
                allProjects = [];
                filteredProjects = [];
                body.innerHTML = `<tr><td colspan="9" class="empty-state">❌ ${err.message}</td></tr>`;
                updateSelectionUI();
            }
        }

        function filterProjects() {
            const search = document.getElementById('search-input').value.trim().toLowerCase();
            filteredProjects = allProjects.filter(project => {
                const matchesSearch = !search || (project.code || '').toLowerCase().includes(search);
                const matchesAuthor = !showMyProjects || ((project.author || '').toLowerCase() === currentUser.toLowerCase());

                let matchesTag = true;
                if (activeTagFilter) {
                    const pTags = tagsData.assignments[project.filename] || [];
                    matchesTag = pTags.includes(activeTagFilter);
                }

                return matchesSearch && matchesAuthor && matchesTag;
            });
            sortProjects();
            renderTable();
        }

        function sortProjects() {
            filteredProjects.sort((a, b) => {
                let av, bv;
                if (sortBy === 'status') {
                    const getStat = (p) => {
                        const s = p.status || 'draft';
                        const isRev = s === 'draft' && p.lastStatusChangedByAdmin;
                        return STATUS_CONFIG[isRev ? 'reverted' : s]?.sort ?? 0;
                    };
                    av = getStat(a); bv = getStat(b);
                } else if (sortBy === 'tags') {
                    av = (tagsData.assignments[a.filename] || []).length;
                    bv = (tagsData.assignments[b.filename] || []).length;
                } else if (sortBy === 'author') {
                    av = (a.author || '').toLowerCase();
                    bv = (b.author || '').toLowerCase();
                } else {
                    av = (a[sortBy] || '').toLowerCase();
                    bv = (b[sortBy] || '').toLowerCase();
                }

                if (av < bv) return sortOrder === 'asc' ? -1 : 1;
                if (av > bv) return sortOrder === 'asc' ? 1 : -1;
                return 0;
            });
        }

        function renderStatusCell(project) {
            const effectiveStatus = project.status || 'draft';
            const isAdminRevert = effectiveStatus === 'draft' && project.lastStatusChangedByAdmin;
            const visual = isAdminRevert ? 'reverted' : effectiveStatus;
            const config = STATUS_CONFIG[visual];

            return `
                <div class="status-pill">
                    <span class="status-dot" style="background:${config.color};"></span>
                    <span>${config.label}</span>
                </div>
            `;
        }

        function renderTagsCell(project) {
            const tags = getProjectTags(project.filename);
            if (!tags.length) return '<span style="color:#445; font-size:11px;">—</span>';
            return `<div class="tags-cell">
                ${tags.map(t => `<div class="mini-tag-box" style="background:${t.color}" title="${t.name}"></div>`).join('')}
            </div>`;
        }

        function getActionButtons(project) {
            const actions = [];
            if (isAdminOrOwner(project)) {
                actions.push(`
                    <span class="action-item">
                        <button class="button delete row-delete-btn" data-filename="${project.filename}">🗑️</button>
                    </span>
                `);
            }
            if (isCurrentUserAdmin()) {
                actions.push(`
                    <span class="action-item">
                        <button class="button assign row-assign-btn" data-filename="${project.filename}">👤</button>
                    </span>
                `);
                if (project.status === 'ready') {
                    actions.push(`
                        <span class="action-item">
                            <button class="button warn" data-filename="${project.filename}" data-action="force-draft">↩️</button>
                        </span>
                    `);
                }
            } else if (!project.author) {
                actions.push(`
                    <span class="action-item">
                        <button class="button assign row-assign-btn" data-filename="${project.filename}">👤</button>
                    </span>
                `);
            }
            return actions.join('');
        }

        function updateSelectionUI() {
            const selectAllEl = document.getElementById('select-all-projects');
            const visibleFilenames = filteredProjects.map(p => p.filename);
            const visibleSelected = visibleFilenames.filter(fn => selectedProjects.has(fn)).length;

            if (selectAllEl) {
                selectAllEl.checked = visibleFilenames.length > 0 && visibleSelected === visibleFilenames.length;
                selectAllEl.indeterminate = visibleSelected > 0 && visibleSelected < visibleFilenames.length;
            }

            const totalSelected = selectedProjects.size;
            const deleteBtn = document.getElementById('delete-selected');
            const exportBtn = document.getElementById('export-selected');

            deleteBtn.disabled = totalSelected === 0;
            exportBtn.disabled = totalSelected === 0;

            deleteBtn.textContent = totalSelected ? `🗑️ Удалить выбранные (${totalSelected})` : '🗑️ Удалить выбранные';
            exportBtn.textContent = totalSelected ? `📦 Экспортировать (${totalSelected})` : '📦 Экспортировать';
        }

        function setupSelectionHandlers() {
            document.querySelectorAll('.project-checkbox').forEach(cb => {
                cb.onclick = e => e.stopPropagation();
                cb.onchange = e => {
                    e.stopPropagation();
                    const filename = cb.dataset.filename;
                    if (cb.checked) selectedProjects.add(filename);
                    else selectedProjects.delete(filename);

                    const row = cb.closest('tr');
                    if (row) row.classList.toggle('row-selected', cb.checked);

                    updateSelectionUI();
                };
            });
        }

        function getSelectedProjectObjects() {
            return allProjects.filter(p => selectedProjects.has(p.filename));
        }

        function getFilenameFromDisposition(disposition) {
            if (!disposition) return '';
            const utf = disposition.match(/filename\*=UTF-8''([^;]+)/i);
            if (utf) return decodeURIComponent(utf[1]);
            const plain = disposition.match(/filename="?([^"]+)"?/i);
            return plain ? plain[1] : '';
        }

        function renderTable() {
            const body = document.getElementById('projects-body');
            if (!filteredProjects.length) {
                body.innerHTML = `<tr><td colspan="9" class="empty-state">${showMyProjects ? 'У вас нет проектов' : 'Ничего не найдено'}</td></tr>`;
                updateSortIndicators();
                updateSelectionUI();
                return;
            }

            body.innerHTML = '';
            filteredProjects.forEach((project, index) => {
                const isSelected = selectedProjects.has(project.filename);
                const row = document.createElement('tr');
                if (isSelected) row.classList.add('row-selected');

                row.innerHTML = `
                    <td class="select-cell">
                        <input type="checkbox" class="project-checkbox" data-filename="${project.filename}" ${isSelected ? 'checked' : ''}>
                    </td>
                    <td>${index + 1}</td>
                    <td>${renderStatusCell(project)}</td>
                    <td>${renderTagsCell(project)}</td>
                    <td title="${project.code || ''}">${project.code || '—'}</td>
                    <td title="${project.type || ''}">${project.type || '—'}</td>
                    <td title="${getProjectDescription(project)}">${getProjectDescription(project)}</td>
                    <td title="${project.author || ''}">${project.author || '—'}</td>
                    <td class="actions-cell">
                        <div class="action-stack">${getActionButtons(project)}</div>
                    </td>
                `;
                row.addEventListener('contextmenu', e => showContextMenu(e, project));
                body.appendChild(row);
            });

            setupSelectionHandlers();
            setupActionButtonsHandlers();
            updateSortIndicators();
            updateSelectionUI();
        }

        function setupActionButtonsHandlers() {
            document.querySelectorAll('.row-delete-btn').forEach(btn => {
                btn.onclick = async e => {
                    e.stopPropagation();
                    const filename = btn.dataset.filename;
                    if (!confirm(`Удалить проект?`)) return;
                    try {
                        await fetch(`/api/project/delete/${encodeURIComponent(filename)}`, {
                            method: 'DELETE',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ user: currentUser })
                        });
                        selectedProjects.delete(filename);
                        loadProjects();
                    } catch (e) {
                        alert(e);
                    }
                };
            });

            document.querySelectorAll('[data-action="force-draft"]').forEach(btn => {
                btn.onclick = async (e) => {
                    e.stopPropagation();
                    const reason = prompt('Комментарий:');
                    if (!reason) return;
                    try {
                        const payload = { filename: btn.dataset.filename, status: 'draft', comment: reason, user: currentUser };
                        await fetch('/api/project/status/set', {
                            method:'POST',
                            headers:{'Content-Type':'application/json'},
                            body: JSON.stringify(payload)
                        });
                        loadProjects();
                    } catch (e) { alert(e); }
                };
            });

            document.querySelectorAll('.row-assign-btn').forEach(btn => {
                btn.onclick = e => {
                    e.stopPropagation();
                    showAuthorSelector(btn);
                };
            });
        }

        function showAuthorSelector(buttonEl) {
            const filename = buttonEl.dataset.filename;
            const holder = buttonEl.closest('.action-item');
            const select = document.createElement('select');
            select.className = 'author-select';
            select.innerHTML = `<option value="">Выбрать</option>` +
                availableAuthors.map(a => `<option value="${a}">${a}</option>`).join('');
            holder.innerHTML = '';
            holder.appendChild(select);
            select.focus();

            select.onchange = async () => {
                const newAuthor = select.value;
                if (!newAuthor) return renderTable();
                try {
                    await fetch('/api/project/set-author', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ filename, author: newAuthor })
                    });
                    await loadProjects();
                } catch (err) { alert(err.message); renderTable(); }
            };
            select.onblur = () => setTimeout(renderTable, 200);
        }

        function showContextMenu(event, project) {
            event.preventDefault();
            selectedProject = project;
            const menu = document.getElementById('context-menu');
            menu.style.display = 'block';

            const rect = menu.getBoundingClientRect();
            let x = event.clientX;
            let y = event.clientY;
            if (x + rect.width > window.innerWidth) x -= rect.width;
            if (y + rect.height > window.innerHeight) y -= rect.height;

            menu.style.left = `${x}px`;
            menu.style.top = `${y}px`;
            document.addEventListener('click', () => menu.style.display = 'none', { once: true });
        }

        document.getElementById('ctx-open-project').onclick = () => {
            if (selectedProject) window.open(`/?load=${encodeURIComponent(selectedProject.filename)}&source=projects`, '_blank');
        };

        document.getElementById('ctx-copy-code').onclick = () => {
            if (selectedProject) navigator.clipboard.writeText(selectedProject.code || '');
        };

        document.getElementById('ctx-show-history').onclick = () => {
            if (!selectedProject) return;
            if (!selectedProject.statusHistory?.length) return alert('Истории нет');
            const msg = selectedProject.statusHistory
                .map(h => `${(h.timestamp || '').split('T')[0]}: ${h.action} (${h.author})`)
                .join('\n');
            alert(msg);
        };

        document.getElementById('ctx-manage-tags').onclick = () => {
            if (!selectedProject) return;
            const overlay = document.getElementById('tag-modal-overlay');
            const list = document.getElementById('tag-list-container');
            list.innerHTML = '';

            const currentTags = tagsData.assignments[selectedProject.filename] || [];

            tagsData.tags.forEach(tag => {
                const label = document.createElement('label');
                label.className = 'tag-option';
                label.innerHTML = `
                    <input type="checkbox" value="${tag.id}" ${currentTags.includes(tag.id) ? 'checked' : ''}>
                    <div style="width:16px;height:16px;background:${tag.color};border-radius:3px;"></div>
                    <span>${tag.name}</span>
                `;
                list.appendChild(label);
            });

            overlay.style.display = 'flex';
        };

        function closeTagModal() {
            document.getElementById('tag-modal-overlay').style.display = 'none';
        }

        async function saveTagsForProject() {
            const checkboxes = document.querySelectorAll('#tag-list-container input[type="checkbox"]');
            const selectedIds = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);

            try {
                await fetch('/api/tags/assign', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ filename: selectedProject.filename, tagIds: selectedIds })
                });
                await loadTags();
                renderTable();
                closeTagModal();
            } catch (e) {
                alert("Ошибка сохранения: " + e.message);
            }
        }

        document.getElementById('search-input').oninput = filterProjects;

        document.getElementById('my-projects').onclick = function() {
            showMyProjects = !showMyProjects;
            this.classList.toggle('active');
            this.textContent = showMyProjects ? '🔖 Все проекты' : '🔖 Мои проекты';
            filterProjects();
        };

        document.getElementById('refresh-projects').onclick = loadProjects;

        document.getElementById('select-all-projects').onchange = function() {
            const visibleFilenames = filteredProjects.map(p => p.filename);
            if (this.checked) visibleFilenames.forEach(fn => selectedProjects.add(fn));
            else visibleFilenames.forEach(fn => selectedProjects.delete(fn));
            renderTable();
        };

        document.getElementById('delete-selected').onclick = async () => {
            const selected = getSelectedProjectObjects();
            if (!selected.length) return;

            const deletable = selected.filter(isAdminOrOwner);
            const skippedByRights = selected.length - deletable.length;

            if (!deletable.length) {
                alert('Среди выбранных нет проектов, которые вы можете удалить.');
                return;
            }

            if (!confirm(`Удалить ${deletable.length} проект(ов)?${skippedByRights ? `\nБудет пропущено по правам: ${skippedByRights}` : ''}`)) {
                return;
            }

            const results = await Promise.all(deletable.map(async project => {
                try {
                    const resp = await fetch(`/api/project/delete/${encodeURIComponent(project.filename)}`, {
                        method: 'DELETE',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ user: currentUser })
                    });

                    if (!resp.ok) {
                        let msg = project.filename;
                        try {
                            const err = await resp.json();
                            msg += `: ${err.detail || 'ошибка'}`;
                        } catch {}
                        return { ok: false, filename: project.filename, message: msg };
                    }

                    return { ok: true, filename: project.filename };
                } catch (e) {
                    return { ok: false, filename: project.filename, message: `${project.filename}: ${e.message}` };
                }
            }));

            results.filter(r => r.ok).forEach(r => selectedProjects.delete(r.filename));
            const deletedCount = results.filter(r => r.ok).length;
            const failed = results.filter(r => !r.ok);

            await loadProjects();

            let message = `Удалено: ${deletedCount}`;
            if (skippedByRights) message += `\nПропущено по правам: ${skippedByRights}`;
            if (failed.length) message += `\nОшибки:\n${failed.map(f => `- ${f.message}`).join('\n')}`;

            alert(message);
        };

        document.getElementById('export-selected').onclick = async () => {
            const filenames = getSelectedProjectObjects().map(p => p.filename);
            if (!filenames.length) return;

            try {
                const resp = await fetch('/api/project/export-selected', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ filenames })
                });

                if (!resp.ok) {
                    let message = 'Ошибка экспорта';
                    try {
                        const err = await resp.json();
                        message = err.detail || message;
                    } catch {}
                    throw new Error(message);
                }

                const blob = await resp.blob();
                const disposition = resp.headers.get('Content-Disposition') || '';
                const filename = getFilenameFromDisposition(disposition) || 'export.zip';

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
            } catch (e) {
                alert(e.message);
            }
        };

        ['status', 'tags', 'type', 'author'].forEach(key => {
            document.getElementById(`sort-${key}`).onclick = () => {
                if (sortBy === key) sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
                else { sortBy = key; sortOrder = 'asc'; }
                sortProjects();
                renderTable();
                updateSortIndicators();
            };
        });

        function updateSortIndicators() {
            document.querySelectorAll('th.sortable').forEach(th => th.classList.remove('asc', 'desc'));
            const current = document.getElementById(`sort-${sortBy}`);
            if (current) current.classList.add(sortOrder);
        }

        loadProjects();
    </script>
</body>
</html>
