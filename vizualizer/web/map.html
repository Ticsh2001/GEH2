<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта зависимостей проектов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }

        .header {
            background: #16213e;
            padding: 10px 20px;
            border-bottom: 2px solid #0f3460;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .header h1 {
            color: #e94560;
            font-size: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            background: #0f3460;
            color: #eee;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #e94560;
        }

        .map-container {
            position: relative;
            width: 100vw;
            height: calc(100vh - 60px);
            overflow: hidden;
            background: #0a0a1a;
        }

        #map-canvas {
            cursor: grab;
        }

        #map-canvas:active {
            cursor: grabbing;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #888;
            font-size: 18px;
        }

        .level-info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(22, 33, 62, 0.9);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            color: #aaa;
            max-width: 300px;
        }

        .legend {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(22, 33, 62, 0.9);
            padding: 10px;
            border-radius: 5px;
            font-size: 11px;
            color: #aaa;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }

        #context-menu {
            display: none;
            position: fixed;
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 5px;
            padding: 5px 0;
            z-index: 1001;
            min-width: 180px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .context-item {
            padding: 8px 15px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        .context-item:hover {
            background: #0f3460;
        }

        .zoom-indicator {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(22, 33, 62, 0.9);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 11px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🗺️ Карта зависимостей проектов</h1>
        <div class="controls">
            <button class="btn" id="btn-refresh">🔄 Обновить</button>
            <button class="btn" id="btn-fit">📐 Вместить все</button>
            <button class="btn" id="btn-reset-zoom">🔍 Сброс масштаба</button>
            <!-- в .controls, рядом с другими кнопками -->
            <button class="btn" id="btn-mode-deps" title="Показать используемые текущим">← Входы</button>
            <button class="btn" id="btn-mode-consumers" title="Показать кто использует текущий">→ Используют</button>
        </div>
    </div>

    <div class="map-container">
        <canvas id="map-canvas"></canvas>
        <div class="loading" id="loading">Загрузка карты зависимостей...</div>
        
        <div class="level-info" id="level-info">
            <strong>Уровни зависимостей:</strong><br>
            <span id="level-details">Загрузка...</span>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: #4a90d9;"></div>
                <span>Базовые сигналы (Уровень 0)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #10b981;"></div>
                <span>Проекты уровня 1</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #f59e0b;"></div>
                <span>Проекты уровня 2+</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #ef4444;"></div>
                <span>Циклические зависимости</span>
            </div>
        </div>

        <div class="zoom-indicator" id="zoom-indicator">100%</div>
    </div>

    <div id="context-menu">
        <div class="context-item" id="ctx-open-project">📂 Открыть проект</div>
        <div class="context-item" id="ctx-show-details">ℹ️ Показать детали</div>
    </div>

    <script src="/js/map.js"></script>
</body>
</html>
