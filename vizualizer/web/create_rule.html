<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание диагностического правила</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #eee; padding: 40px; display: flex; justify-content: center; }
        .container { background: #16213e; padding: 30px; border-radius: 12px; border: 1px solid #0f3460; width: 100%; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        h1 { color: #e94560; font-size: 22px; margin-bottom: 20px; }
        .info-block { background: #0a0a1a; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #4a90d9; font-size: 14px; }
        .info-block div { margin-bottom: 6px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #aaa; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #233860; background: #0f3460; color: #fff; font-size: 14px; box-sizing: border-box; }
        .btn { padding: 12px 20px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 15px; width: 100%; margin-top: 10px; }
        .btn-primary { background: #4ade80; color: #0a0a0a; }
        .btn-primary:hover { background: #22c55e; }
        .hidden { display: none !important; }
        #status { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; font-size: 14px; white-space: pre-wrap; }
        .status-success { background: rgba(74, 222, 128, 0.2); color: #4ade80; border: 1px solid #4ade80; }
        .status-error { background: rgba(248, 113, 113, 0.2); color: #f87171; border: 1px solid #f87171; }
        .warn-text { color: #fbbf24; font-size: 12px; margin-top: 5px; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Мастер создания правила</h1>
        
        <div class="info-block">
            <div><strong>Модель (KKS):</strong> <span id="val-nn-kks">-</span></div>
            <div><strong>Целевой параметр (Y):</strong> <span id="val-y-kks">-</span></div>
            <div><strong>Условие запуска (KKS):</strong> <span id="val-startup-kks" style="color: #4ade80;">-</span></div>
            <div><strong>Существующее правило:</strong> <span id="val-existing-rule" style="color: #fbbf24;">-</span></div>
        </div>

        <div class="form-group">
            <label>Тип модели:</label>
            <select id="model-type">
                <option value="prediction">Предсказательная (24 часа вперед)</option>
                <option value="normal">Нормальное состояние (контроль качества)</option>
            </select>
        </div>

        <div class="form-group hidden" id="only-tech-cond-group" style="padding:10px; background:rgba(74,222,128,0.1); border-radius:6px; border:1px solid rgba(74,222,128,0.3);">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: #eee;">
                <input type="checkbox" id="chk-only-tech-cond" style="width: 18px; height: 18px; margin: 0;">
                <span style="font-weight: 500;">Создать только коэффициент технического состояния</span>
            </label>
            <small style="color: #9ca3af; display: block; margin-top: 4px; margin-left: 26px;">
                Правило уже существует — пересоздавать его не будем. Будут созданы только проекты тех. состояния.
            </small>
        </div>

        <div class="form-group">
            <label id="p-label">95-й перцентиль модели (Погрешность):</label>
            <input type="number" id="val-p95" step="any">
        </div>

        <div id="prediction-fields">
            <div class="form-group">
                <label>Тип уставки для <span class="y-kks-text"></span>:</label>
                <div style="display: flex; gap: 15px; margin-bottom: 10px;">
                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                        <input type="radio" name="limit_type" value="working" checked> Рабочий диапазон
                    </label>
                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                        <input type="radio" name="limit_type" value="warning"> Предупредительная сигнализация
                    </label>
                </div>
                <label>Предельно допустимое значение:</label>
                <input type="number" id="val-max-param" step="any" placeholder="Введите значение...">
            </div>
        </div>

        <div id="normal-state-fields" class="hidden">
            <hr style="border-color:#374151; margin:15px 0;">
            <h4 style="margin-bottom:10px; font-size:14px; color:#9ca3af;">Техническое состояние</h4>
            
            <div class="form-group">
                <label>Время валидации параметра (в мин):</label>
                <input type="number" id="val-valid-time" value="1440" step="1">
            </div>
            <div class="form-group">
                <label>Чувствительность валидации:</label>
                <input type="number" id="val-valid-sens" value="1.0" step="any">
            </div>
            <div class="form-group">
                <label>Временное окно памяти накопления деградации (в мин):</label>
                <input type="number" id="val-tech-time" value="43200" step="1">
            </div>
        </div>

        <div id="control-change-fields" class="hidden">
            <hr style="border-color:#374151; margin:15px 0;">
            <h4 style="margin-bottom:10px; font-size:14px; color:#9ca3af;">Контроль изменения параметра</h4>
            
            <div class="form-group">
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: #eee;">
                        <input type="radio" name="control_type" value="0" checked style="width:18px; height:18px; margin:0;">
                        <span><b>Уменьшение</b> — контролируем только снижение параметра</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: #eee;">
                        <input type="radio" name="control_type" value="1" style="width:18px; height:18px; margin:0;">
                        <span><b>Увеличение</b> — контролируем только рост параметра</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: #eee;">
                        <input type="radio" name="control_type" value="2" style="width:18px; height:18px; margin:0;">
                        <span><b>В обе стороны</b> — контролируем любые изменения</span>
                    </label>
                </div>
            </div>
        </div>

        <button id="btn-save" class="btn btn-primary">Создать проекты</button>
        
        <div id="status"></div>
    </div>

        <script>
        const urlParams = new URLSearchParams(window.location.search);
        const nnKks = urlParams.get('nn_kks') || '';
        const yKks = urlParams.get('y_kks') || '';
        const p95 = parseFloat(urlParams.get('p95')) || 0;
        const p99 = parseFloat(urlParams.get('p99')) || 0;
        const startupKks = urlParams.get('startup_kks') || '';
        const diagRuleKks = urlParams.get('diag_rule_kks') || '';
        const hasExistingRule = !!diagRuleKks;
        const config = urlParams.get('config') || '';

        document.getElementById('val-nn-kks').textContent = nnKks;
        document.getElementById('val-y-kks').textContent = yKks;
        document.querySelectorAll('.y-kks-text').forEach(el => el.textContent = yKks);
        
        const startupEl = document.getElementById('val-startup-kks');
        if (startupKks) {
            startupEl.textContent = startupKks;
        } else {
            startupEl.textContent = 'Не задано (будет пропущено)';
            startupEl.style.color = '#fbbf24';
        }

        // Показываем существующее правило в шапке
        const ruleExistEl = document.getElementById('val-existing-rule');
        if (hasExistingRule) {
            ruleExistEl.textContent = diagRuleKks;
            ruleExistEl.style.color = '#4ade80';
        } else {
            ruleExistEl.textContent = 'нет (будет создано)';
        }
        
        const setPValue = (val) => { document.getElementById('val-p95').value = val; };
        setPValue(p95);

        const statusDiv = document.getElementById('status');
        const showStatus = (msg, isError = false) => {
            statusDiv.textContent = msg;
            statusDiv.className = isError ? 'status-error' : 'status-success';
            statusDiv.style.display = 'block';
        };

        const addConfig = (url) => url + (url.includes('?') ? '&' : '?') + `config=${encodeURIComponent(config)}`;

        document.getElementById('model-type').addEventListener('change', (e) => {
            const type = e.target.value;
            const pLabel = document.getElementById('p-label');
            const onlyTechGroup = document.getElementById('only-tech-cond-group');
            
            if (type === 'prediction') {
                document.getElementById('prediction-fields').classList.remove('hidden');
                document.getElementById('normal-state-fields').classList.add('hidden');
                document.getElementById('control-change-fields').classList.add('hidden');
                onlyTechGroup.classList.add('hidden');
                setPValue(p95);
                pLabel.textContent = '95-й перцентиль модели (Погрешность):';
            } else {
                document.getElementById('prediction-fields').classList.add('hidden');
                document.getElementById('normal-state-fields').classList.remove('hidden');
                document.getElementById('control-change-fields').classList.remove('hidden');
                // Чекбокс показываем только если правило уже создано
                if (hasExistingRule) {
                    onlyTechGroup.classList.remove('hidden');
                }
                setPValue(p99);
                pLabel.textContent = '99-й перцентиль модели (Погрешность):';
            }
        });

        document.getElementById('btn-save').onclick = async () => {
            const modelType = document.getElementById('model-type').value;
            const isPrediction = modelType === 'prediction';
            const pVal = parseFloat(document.getElementById('val-p95').value);
            
            // Режим "только тех состояние" 
            const onlyTechCond = hasExistingRule 
                && !isPrediction 
                && document.getElementById('chk-only-tech-cond')?.checked;

            if (!onlyTechCond && isNaN(pVal)) {
                showStatus('Заполните поле перцентиля!', true);
                return;
            }

            let maxVal = null;
            let validTime = null, validSens = null, techTime = null;
            let controlType = 0;

            if (isPrediction) {
                maxVal = parseFloat(document.getElementById('val-max-param').value);
                if (isNaN(maxVal)) {
                    showStatus('Введите предельно допустимое значение!', true);
                    return;
                }
            } else {
                validTime = parseFloat(document.getElementById('val-valid-time').value);
                validSens = parseFloat(document.getElementById('val-valid-sens').value);
                techTime = parseFloat(document.getElementById('val-tech-time').value);
                if (isNaN(validTime) || isNaN(validSens) || isNaN(techTime)) {
                    showStatus('Заполните все поля технического состояния!', true);
                    return;
                }
                const controlEl = document.querySelector('input[name="control_type"]:checked');
                controlType = controlEl ? parseInt(controlEl.value) : 0;
            }

            const btn = document.getElementById('btn-save');
            btn.disabled = true;
            btn.textContent = '⏳ Создание...';

            try {
                // 1. Размерность Y-сигнала
                const infoResp = await fetch(addConfig(`/api/signal-info/${encodeURIComponent(yKks)}`));
                const infoData = await infoResp.json();
                const dimension = infoData.dimension || '';

                // 2. Имена проектов
                const maxConstKks = `${nnKks}_MAX_PARAM_CONST`;
                const pConstKks = `${nnKks}_PERCENTIL_CONST`;
                const ruleKks = `${nnKks}_PROBLEM`;
                
                const createdProjects = [];  // <-- Список созданных проектов

                // 3. Хелперы
                const createConstProject = async (code, value, description, dim = "") => {
                    const payload = {
                        version: '1.0',
                        project: {
                            code: code, type: 'parameter', description: description, dimension: dim,
                            author: 'Система', status: 'draft', statusHistory: []
                        },
                        elements: {
                            const_1: { id: 'const_1', type: 'const', x: 100, y: 100, width: 120, height: 60, props: { value: value, description: description } },
                            out_1: { id: 'out_1', type: 'output', x: 300, y: 100, width: 150, height: 60, props: { label: code } }
                        },
                        connections: [ { fromElement: 'const_1', fromPort: 'out-0', toElement: 'out_1', toPort: 'in-0' } ],
                        counter: 2, code: String(value)
                    };
                    const resp = await fetch(addConfig('/api/project/save'), {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: `${code}_parameter.json`, target: 'projects', content: payload })
                    });
                    if (!resp.ok) throw new Error(`Ошибка сохранения ${code}`);
                    createdProjects.push(code);
                };

                const createMathProject = async (code, description, formulaText, inputKksList, dim = "") => {
                    const elements = {};
                    const connections = [];
                    inputKksList.forEach((kks, i) => {
                        const id = `in_${i+1}`;
                        elements[id] = { id: id, type: 'input-signal', x: 100, y: 50 + i * 100, width: 150, height: 60, props: { name: kks } };
                        connections.push({ fromElement: id, fromPort: 'out-0', toElement: 'formula_1', toPort: `in-${i}` });
                    });
                    elements['formula_1'] = {
                        id: 'formula_1', type: 'formula', x: 350, y: 150, width: 200, height: 100,
                        props: { expression: formulaText, inputCount: inputKksList.length }
                    };
                    elements['out_1'] = { id: 'out_1', type: 'output', x: 650, y: 150, width: 150, height: 60, props: { label: code } };
                    connections.push({ fromElement: 'formula_1', fromPort: 'out-0', toElement: 'out_1', toPort: 'in-0' });
                    
                    const payload = {
                        version: '1.0',
                        project: { code: code, type: 'parameter', description: description, dimension: dim, author: 'Система', status: 'draft', statusHistory: [] },
                        elements: elements, connections: connections, counter: 10, code: formulaText
                    };
                    const resp = await fetch(addConfig('/api/project/save'), {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: `${code}_parameter.json`, target: 'projects', content: payload })
                    });
                    if (!resp.ok) throw new Error(`Ошибка создания ${code}`);
                    createdProjects.push(code);
                };

                // 4. Создание полного набора тех. состояния (используется в обоих режимах)
                const createTechConditionProjects = async () => {
                    const validTimeKks = `${nnKks}_VALID_TIME_CONST`;
                    const validSensKks = `${nnKks}_VALID_SENSITIVITY_CONST`;
                    const techTimeKks = `${nnKks}_TECHNICAL_TIME_CONST`;
                    const validCondKks = `${nnKks}_VALID_COND`;
                    const degradKks = `${nnKks}_DEGRADATION`;
                    const techCondKks = `${nnKks}_TECHNICAL_CONDITION`;

                    await createConstProject(validTimeKks, validTime, `Временное окно, на котором валидируются показания отслеживаемого параметра`, "мин");
                    await createConstProject(validSensKks, validSens, `Величина чувствительности для контроля изменения параметра`, dimension);
                    await createConstProject(techTimeKks, techTime, `Временное окно накопления деградации оборудования`, "мин");

                    await createMathProject(
                        validCondKks, 
                        `Валидация значений сигнала ${yKks} для расчета коэффициенте технического состояния. 1 - показания валидные, 0 - показания невалидные`,
                        `valid_func(${yKks}, ${startupKks}, ${validTimeKks}, ${validSensKks})`,
                        [yKks, startupKks, validTimeKks, validSensKks], "флаг"
                    );
                    await createMathProject(
                        degradKks,
                        `Расчет коэффициента деградации оборудования по параметру ${yKks}`,
                        `tech_cond_calc(${nnKks}, ${yKks}, ${pConstKks}, ${validCondKks}, ${controlType})`,
                        [nnKks, yKks, pConstKks, validCondKks], "коэф."
                    );
                    await createMathProject(
                        techCondKks,
                        `Расчет коэффициента деградации оборудования по параметру ${yKks} (режим: ${
                            controlType === 0 ? 'уменьшение' 
                            : controlType === 1 ? 'увеличение' 
                            : 'в обе стороны'
                        })`,
                        `integral_tech_cond(${degradKks}, ${validCondKks}, ${techTimeKks})`,
                        [degradKks, validCondKks, techTimeKks], "коэф."
                    );
                    
                    return techCondKks;
                };

                // 5. Основная логика
                let techCondKks = null;
                let ruleCreated = false;

                if (onlyTechCond) {
                    // Режим "только тех. состояние"
                    techCondKks = await createTechConditionProjects();
                } else {
                    // Полное создание
                    const pDesc = isPrediction 
                        ? `95-й перцентиль модели. Погрешность работы модели, при которой 95% всех ее предсказаний ниже этой величины`
                        : `99-й перцентиль модели. Погрешность работы модели, при которой 99% всех ее предсказаний ниже этой величины`;
                    await createConstProject(pConstKks, pVal, pDesc);

                    let baseInputs = [
                        { id: 'in_1', name: nnKks },
                        { id: 'in_2', name: isPrediction ? maxConstKks : yKks },
                        { id: 'in_3', name: pConstKks }
                    ];

                    if (isPrediction) {
                        const limitType = document.querySelector('input[name="limit_type"]:checked').value;
                        const maxDesc = limitType === 'working' 
                            ? `Уставка на допустимое значение измеряемого параметра ${yKks}. Соответствует максимальному значению рабочего диапазона.`
                            : `Уставка на допустимое значение измеряемого параметра ${yKks}. Соответствует значению срабатывания предупредительной сигнализации.`;
                        await createConstProject(maxConstKks, maxVal, maxDesc, dimension);
                    }

                    if (startupKks) baseInputs.push({ id: 'in_4', name: startupKks });

                    const formulaArgs = baseInputs.map(i => i.name);
                    const formulaText = `${isPrediction ? 'prediction_nn' : 'normal_operation_nn'}(${formulaArgs.join(', ')})`;

                    const ruleElements = {};
                    const ruleConnections = [];
                    baseInputs.forEach((inp, idx) => {
                        ruleElements[inp.id] = { id: inp.id, type: 'input-signal', x: 100, y: 50 + idx * 100, width: 150, height: 60, props: { name: inp.name } };
                        ruleConnections.push({ fromElement: inp.id, fromPort: 'out-0', toElement: 'formula_5', toPort: `in-${idx}` });
                    });
                    ruleElements['formula_5'] = { id: 'formula_5', type: 'formula', x: 350, y: 150, width: 200, height: 120, props: { expression: formulaText, inputCount: baseInputs.length } };
                    ruleElements['out_6'] = { id: 'out_6', type: 'output', x: 650, y: 150, width: 150, height: 60, props: { label: ruleKks } };
                    ruleConnections.push({ fromElement: 'formula_5', fromPort: 'out-0', toElement: 'out_6', toPort: 'in-0' });

                    const rulePayload = {
                        version: '1.0',
                        project: { code: ruleKks, type: 'rule', description: '', possibleCause: '', guidelines: '', author: 'Система', status: 'draft', statusHistory: [] },
                        elements: ruleElements, connections: ruleConnections, counter: 6, code: formulaText
                    };
                    const ruleResp = await fetch(addConfig('/api/project/save'), {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: `${ruleKks}_rule.json`, target: 'projects', content: rulePayload })
                    });
                    if (!ruleResp.ok) throw new Error(`Ошибка создания правила ${ruleKks}`);
                    createdProjects.push(ruleKks);
                    ruleCreated = true;

                    if (!isPrediction) {
                        techCondKks = await createTechConditionProjects();
                    }
                }

                // 6. Сообщение об успехе с полным списком
                let successMsg = `✅ Успешно созданы проекты (${createdProjects.length}):\n`;
                successMsg += createdProjects.map((p, i) => `${i+1}. ${p}`).join('\n');
                successMsg += `\n\nВы можете закрыть эту вкладку.`;
                if (techCondKks) successMsg += `\nКоэффициент тех. состояния: ${techCondKks}`;
                
                showStatus(successMsg);
                btn.textContent = 'Готово';
                
                // 7. postMessage для авто-заполнения полей в редакторе
                if (window.opener) {
                    if (ruleCreated) {
                        window.opener.postMessage({ type: 'RULE_CREATED', kks: ruleKks }, '*');
                    }
                    if (techCondKks) {
                        window.opener.postMessage({ type: 'TECH_COND_CREATED', kks: techCondKks }, '*');
                    }
                }

            } catch (e) {
                console.error(e);
                showStatus(`❌ Ошибка: ${e.message}`, true);
                btn.disabled = false;
                btn.textContent = 'Создать проекты';
            }
        };
    </script>
</body>
</html>
